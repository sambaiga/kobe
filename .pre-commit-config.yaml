# Runs under prek (a fast, drop-in Rust implementation: `uv run prek ...`) or under pre-commit
# (`uvx pre-commit ...`); the file is the same. Install: `make hooks`.
default_language_version:
  python: python3.12

exclude: ^(.idea/|__pycache__/|.pytest_cache/|.venv/)

ci:
  autoupdate_schedule: monthly

repos:
  - repo: local
    hooks:
      - id: commitizen
        name: commitizen check
        entry: uv run cz check
        args: [--commit-msg-file]
        require_serial: true
        language: system
        stages: [commit-msg]
      - id: no-ai-trailer
        name: no AI co-author or "generated with" trailer
        description: The commit author is the user alone.
        entry: '(?i)^(co-authored-by:.*(claude|anthropic|copilot|openai|chatgpt|gpt|gemini|cursor|codeium|aider)|.*generated (with|by) \[?(claude|copilot|chatgpt|gemini))'
        language: pygrep
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.10
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.ipynb$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: [--ignore-words=codespell.ignore]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        name: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff-format
