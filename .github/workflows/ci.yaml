name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  hooks-and-tests:
    name: Hooks and generator tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Run the hooks
        run: uvx prek run --all-files
        env:
          SKIP: no-commit-to-branch
      - name: Sync
        run: uv sync --locked
      - name: Types
        run: uv run ty check
      - name: Generator tests
        run: uv run pytest

  profile:
    name: Generated ${{ matrix.profile }} project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [library, experiment]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Generate the project
        env:
          PROFILE: ${{ matrix.profile }}
        run: uv run --no-project python new.py demo-project --profile "$PROFILE" --dest "$RUNNER_TEMP"
      - name: Install, lint, type check and test it as a user would
        working-directory: ${{ runner.temp }}/demo-project
        run: |
          uv sync
          uv run ruff check . --no-fix
          uv run ruff format --check .
          uv run ty check
          uv run deptry .
          uv run pytest
      - name: Check the import layers
        if: matrix.profile == 'experiment'
        working-directory: ${{ runner.temp }}/demo-project
        run: uv run lint-imports
      - name: Run its hooks
        working-directory: ${{ runner.temp }}/demo-project
        run: |
          git add .
          uvx prek run --all-files
          uvx prek run --all-files --hook-stage pre-push
        env:
          SKIP: no-commit-to-branch,ty,deptry
