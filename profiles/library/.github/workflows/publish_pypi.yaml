name: Publish to PyPI

run-name: Publish ${{ github.ref_name }} to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          enable-cache: false  # a release must not restore a cache an earlier run could have poisoned
      - name: Verify that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          project_version=$(uv version --short)
          if [ "${REF_NAME#v}" != "${project_version}" ]; then
            echo "::error::Tag ${REF_NAME} does not match pyproject.toml version ${project_version}"
            exit 1
          fi
      - name: Build the wheel and the sdist
        run: uv build
      - name: Check the distributions
        run: uvx twine check dist/*
      - name: Smoke test the wheel in a clean environment
        run: uv run --no-project --isolated --with dist/*.whl python -c "import sample_package; print(sample_package.__version__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no API token is stored
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          enable-cache: false  # a release must not restore a cache an earlier run could have poisoned
      - name: Publish
        run: uv publish --trusted-publishing always dist/*
