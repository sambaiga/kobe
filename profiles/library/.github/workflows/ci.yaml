name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # prek runs the commit-stage hooks of .pre-commit-config.yaml. The ty, docstrings and deptry hooks run
      # in the test job below, after a full sync. no-commit-to-branch guards local commits only.
      - name: Run the hooks
        run: uvx prek run --all-files
        env:
          SKIP: no-commit-to-branch

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # private-dependency-step
      - name: Install the locked environment
        run: uv sync --locked --all-extras
      - name: Ruff
        run: |
          uv run ruff check . --no-fix
          uv run ruff format --check .
      - name: Types
        run: uv run ty check
      - name: Dependencies
        run: uv run deptry .
      - name: Docstrings
        run: uv run python scripts/check_docstrings.py --fail-under 90 $(git ls-files 'sample_package/*.py' 'scripts/*.py')
      - name: Tests
        run: uv run pytest
      - name: Coverage of the changed lines
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=90
